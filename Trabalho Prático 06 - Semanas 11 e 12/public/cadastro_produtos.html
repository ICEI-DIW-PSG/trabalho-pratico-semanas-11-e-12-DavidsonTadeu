<main>
    <h1 id="titulo-form">Cadastrar Produto</h1>
    <form id="form-produto">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" required><br>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao"></textarea><br>

        <button type="submit">Salvar</button>
        <button type="button" id="btn-excluir" style="display:none;">Excluir</button>
    </form>
    <a href="index.html">Voltar para a lista</a>
</main>
<script src="app.js"></script>
